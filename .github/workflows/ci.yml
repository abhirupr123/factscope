name: FactScope CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend and CI dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt mypy pip-audit
      - name: Compile Python
        run: python -m compileall -q .
      - name: Type-check outbound safety module
        run: python -m mypy --ignore-missing-imports --follow-imports=skip safe_fetch.py
      - name: Run backend tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Audit Python dependencies
        run: python -m pip_audit --local --skip-editable --progress-spinner off

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run extension tests
        run: node --test frontend/tests/*.test.js
      - name: Validate and package production extension
        run: python scripts/package_extension.py --output dist/factscope-extension.zip
      - uses: actions/upload-artifact@v5
        with:
          name: factscope-extension
          path: dist/factscope-extension.zip
          if-no-files-found: error

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Reject tracked local and credential artifacts
        run: python scripts/check_tracked_artifacts.py
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
