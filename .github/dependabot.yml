version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    versioning-strategy: increase-if-necessary
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      backend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
