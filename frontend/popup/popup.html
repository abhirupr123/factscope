<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>FactScope</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="app" class="card">
      <div class="brand-row">
        <div class="logo-dot"><svg viewBox="0 0 100 100" width="26" height="26"><circle cx="50" cy="50" r="46" fill="#4F46E5"/><circle cx="50" cy="50" r="38" fill="#6366F1"/><circle cx="50" cy="50" r="30" fill="#4F46E5"/><polyline points="33,52 45,64 68,38" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="brand-text">
          <p class="eyebrow">Content authenticity</p>
          <h3>FactScope</h3>
        </div>
      </div>

      <p class="tagline">
        Scan any page to check for misinformation, spam, phishing,
        and AI&#8209;generated content.
      </p>

      <div id="usage-bar" class="usage-bar" style="display:none">
        <div class="usage-row">
          <span id="usage-tier" class="tier-badge">free</span>
          <span id="usage-text" class="usage-text">–/– scans</span>
        </div>
        <div class="progress-track">
          <div id="usage-fill" class="progress-fill"></div>
        </div>
      </div>

      <button id="scan-tab">Scan current tab</button>

      <div id="last-result" class="hint">
        Results appear as an overlay on the page you&rsquo;re viewing.
      </div>

      <div id="history-section">
        <div class="history-header">
          <span class="history-title">Recent scans</span>
          <button id="clear-history" class="clear-btn">Clear</button>
        </div>
        <div id="history-list"></div>
      </div>

      <details class="privacy-settings">
        <summary>Privacy &amp; data</summary>
        <label class="setting-row" for="telemetry-enabled">
          <span>
            <strong>Anonymous telemetry</strong>
            <small>Send event names such as ?scan completed.? Never sends page text, titles, claims, or URLs.</small>
          </span>
          <input id="telemetry-enabled" type="checkbox" />
        </label>
        <button id="delete-server-data" class="danger-outline" type="button">Delete my server data</button>
        <p id="privacy-status" class="privacy-status" role="status"></p>
        <a class="privacy-link" href="https://factscope.netlify.app/privacy" target="_blank" rel="noopener noreferrer">Read the privacy policy</a>
      </details>

      <!-- <details id="upgrade-section" class="upgrade-section">
        <summary>Have a license key?</summary>
        <div class="upgrade-form">
          <input id="license-key" type="text" placeholder="Enter license key" spellcheck="false" />
          <button id="redeem-btn">Activate</button>
        </div>
        <p id="redeem-msg" class="redeem-msg"></p>
      </details> -->
    </div>
    <script src="popup.js"></script>
  </body>
</html>
