<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>FactScope</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="app" class="card">
      <div class="brand-row">
        <div class="logo-dot">FS</div>
        <div class="brand-text">
          <p class="eyebrow">Content authenticity</p>
          <h3>FactScope</h3>
        </div>
      </div>

      <p class="tagline">
        Scan any page to check for misinformation, spam, phishing,
        and AI&#8209;generated content.
      </p>

      <button id="scan-tab">Scan current tab</button>

      <div id="last-result" class="hint">
        Results appear as an overlay on the page you&rsquo;re viewing.
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
