<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{page_title}</title>
<meta name="description" content="{meta_description}">
<meta property="og:title" content="{page_title}">
<meta property="og:description" content="{meta_description}">
<meta property="og:type" content="article">
<meta property="og:site_name" content="FactScope">
{og_image_meta}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{page_title}">
<meta name="twitter:description" content="{meta_description}">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%234f46e5'/%3E%3Cpath d='M19 33l9 9 18-22' fill='none' stroke='white' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
*{{box-sizing:border-box}}:root{{--bg:#f5f7fb;--surface:#fff;--soft:#f8fafc;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;--accent:#4f46e5;--accent-soft:#eef2ff;--shadow:0 14px 40px rgba(15,23,42,.08)}}
[data-theme="dark"]{{--bg:#090e1a;--surface:#111827;--soft:#172033;--border:#293548;--text:#f1f5f9;--muted:#9aa8bd;--accent:#818cf8;--accent-soft:#20264a;--shadow:0 18px 50px rgba(0,0,0,.28)}}
body{{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",system-ui,sans-serif;line-height:1.55}}a{{color:var(--accent)}}
.nav{{height:68px;padding:0 32px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}}
.brand{{display:flex;align-items:center;gap:10px;font-weight:750}}.brand svg{{width:34px;height:34px}}.nav-actions{{display:flex;gap:10px;align-items:center}}button,.install{{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:9px;padding:9px 14px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none}}.install{{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650}}
.shell{{max-width:1200px;margin:0 auto;padding:42px 28px 24px;display:grid;grid-template-columns:minmax(300px,.8fr) minmax(440px,1.2fr);gap:28px;align-items:start}}.shell.no-preview-image{{grid-template-columns:1fr;max-width:920px}}.shell.no-preview-image .preview{{border-left:4px solid var(--accent)}}
.preview,.assessment,.card,.compat,.share-bar{{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow)}}.preview{{overflow:hidden;position:sticky;top:96px}}.shell.no-preview-image .preview{{position:static}}.preview-image{{display:block;width:100%;max-height:340px;object-fit:cover;background:var(--soft)}}.preview-body{{padding:25px 28px}}.eyebrow,.card-heading{{color:var(--muted);font-size:11px;font-weight:750;letter-spacing:.09em;text-transform:uppercase}}.preview-title{{font-size:22px;line-height:1.3;margin:10px 0 16px}}.preview-source{{display:flex;align-items:center;gap:9px;color:var(--muted);font-weight:650;font-size:14px}}.source-mark{{width:26px;height:26px;border-radius:7px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}}.preview-url{{display:inline-block;margin-top:14px;font-size:13px;text-decoration:none}}.preview-unavailable{{margin-top:14px;color:var(--muted);font-size:12px}}.hidden{{display:none}}
.result{{display:flex;flex-direction:column;gap:18px}}.assessment{{padding:30px}}.status{{font-size:31px;line-height:1.18;font-weight:780;margin:12px 0 5px}}.confidence{{font-size:13px;text-transform:capitalize;color:var(--accent);font-weight:700}}.summary{{font-size:16px;color:var(--muted);margin:18px 0}}.counts{{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:20px 0}}.counts div{{background:var(--soft);border:1px solid var(--border);border-radius:11px;padding:12px;text-align:center}}.counts strong,.counts span{{display:block}}.counts strong{{font-size:20px}}.counts span{{font-size:10px;color:var(--muted);text-transform:uppercase}}.metadata{{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}}.metadata span{{font-size:11px;color:var(--muted);background:var(--soft);padding:6px 9px;border-radius:999px}}
.card{{padding:24px 26px}}.card-heading{{margin-bottom:12px}}.claim{{padding:16px 0;border-top:1px solid var(--border)}}.claim:first-of-type{{border-top:0}}.claim-text{{font-weight:650}}.claim-meta{{display:flex;gap:9px;flex-wrap:wrap;margin-top:7px;font-size:12px}}.claim-meta strong{{color:var(--accent)}}.claim-meta span{{color:var(--muted)}}.source-group{{margin-top:12px}}.source-heading{{font-size:11px;font-weight:700;color:var(--muted)}}.source-group ul,.details ul{{margin:7px 0 0;padding-left:19px}}.source-group li{{margin:6px 0;font-size:13px}}.source-group li span{{display:block;color:var(--muted);font-size:11px}}.details summary,.compat summary{{font-weight:700;cursor:pointer}}.details p,.details li,.compat p{{color:var(--muted);font-size:14px}}.caveat{{margin-top:13px;padding:11px 13px;background:var(--accent-soft);color:var(--muted);font-size:12px;border-radius:9px}}.compat{{padding:15px 20px}}.compat summary{{font-size:12px;color:var(--muted)}}.compat p{{margin-bottom:0}}
.share-wrap{{max-width:920px;margin:0 auto;padding:0 28px 35px}}.share-bar{{padding:17px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}}.share-bar span{{font-size:12px;color:var(--muted);margin-right:5px}}.share-bar a,.share-bar button{{font-size:12px;padding:8px 13px;text-decoration:none}}
.footer{{text-align:center;border-top:1px solid var(--border);padding:28px;color:var(--muted);font-size:12px}}.footer strong{{color:var(--text)}}
@media(max-width:850px){{.shell,.shell.no-preview-image{{grid-template-columns:1fr;padding:24px 16px}}.preview{{position:static}}.nav{{padding:0 16px}}.install{{display:none}}.counts{{grid-template-columns:repeat(2,1fr)}}.status{{font-size:26px}}.share-wrap{{padding:0 16px 28px}}}}
</style>
</head>
<body>
<nav class="nav"><div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="#4f46e5"/><path d="M19 33l9 9 18-22" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>FactScope</span></div><div class="nav-actions"><button id="themeToggle" aria-label="Toggle color theme">Theme</button><a class="install" href="#install">Install extension</a></div></nav>
<div class="shell {layout_class}">{preview_html}{snapshot_html}</div>
<div class="share-wrap">{share_buttons_html}</div>
<footer class="footer"><strong>FactScope assists verification.</strong> It does not determine whether content is conclusively true or false.</footer>
<script>
(function(){{
  const root=document.documentElement;
  const theme=document.getElementById('themeToggle');
  const image=document.getElementById('previewImage');
  const unavailable=document.getElementById('previewUnavailable');
  const shell=document.querySelector('.shell');
  const copy=document.getElementById('copyLink');
  function setTheme(dark){{root.dataset.theme=dark?'dark':'';try{{localStorage.setItem('fs_theme',dark?'dark':'light')}}catch(_err){{}}}}
  theme.addEventListener('click',()=>setTheme(root.dataset.theme!=='dark'));
  try{{if(localStorage.getItem('fs_theme')==='dark')setTheme(true)}}catch(_err){{}}
  if(image)image.addEventListener('error',()=>{{image.remove();shell.classList.add('no-preview-image');unavailable.classList.remove('hidden')}});
  if(copy)copy.addEventListener('click',async()=>{{try{{await navigator.clipboard.writeText(copy.dataset.url);copy.textContent='Copied!'}}catch(_err){{copy.textContent='Copy failed'}}}});
}})();
</script>
</body>
</html>
